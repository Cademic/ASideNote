<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Keep in sync with STORAGE_KEY in src/context/ThemeContext.tsx. Runs before
         any CSS loads so the browser's default canvas color-scheme (and Tailwind's
         .dark class) are correct on first paint, instead of flashing white/light. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("asidenote.theme");
          var isDark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Start your note taking journey off right" />
    <meta name="theme-color" content="#f7f2e9" />
    <link rel="canonical" href="https://asidenote.net/" />
    <link rel="icon" type="image/ico" href="/favicon.ico" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ASideNote" />
    <meta property="og:url" content="https://asidenote.net/" />
    <meta property="og:title" content="ASideNote" />
    <meta
      property="og:description"
      content="Pin sticky notes, index cards, and sketches to a freeform cork board. Group them into projects, then plan the week around them with real-time collaboration."
    />
    <meta property="og:image" content="https://asidenote.net/asidenote-logo.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ASideNote" />
    <meta
      name="twitter:description"
      content="Pin sticky notes, index cards, and sketches to a freeform cork board. Group them into projects, then plan the week around them with real-time collaboration."
    />
    <meta name="twitter:image" content="https://asidenote.net/asidenote-logo.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>ASideNote</title>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
